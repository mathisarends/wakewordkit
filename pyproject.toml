[project]
name = "wakewordkit"
version = "0.1.0"
description = "Lightweight, developer-friendly wake word detection built on openWakeWord."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["wake-word", "keyword-spotting", "openwakeword", "voice", "speech"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "openwakeword>=0.4.0",
]

[project.optional-dependencies]
mic = [
    "sounddevice>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wakewordkit"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wakewordkit --cov-report=term-missing"

[tool.coverage.run]
source = ["wakewordkit"]

[tool.coverage.report]
exclude_also = ["raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
