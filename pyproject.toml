[project]
name = "wakewordkit"
dynamic = ["version"]
description = "Lightweight, developer-friendly wake word detection built on openWakeWord."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["wake-word", "keyword-spotting", "openwakeword", "voice", "speech"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    # 0.4.0 bundles the ONNX models; newer releases change the backend API.
    "openwakeword==0.4.0",
    "soxr>=1.0,<2",
]

[project.optional-dependencies]
examples = [
    "openai>=2.46.0,<4",
    "python-dotenv>=1.1.0",
    "sounddevice>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wakewordkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wakewordkit"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real openWakeWord inference and state tests"]
addopts = "--cov=wakewordkit --cov-report=term-missing"

[tool.coverage.run]
source = ["wakewordkit"]

[tool.coverage.report]
exclude_also = ["raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.0",
    "mypy>=1.19,<2",
    "psutil>=7,<8",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["wakewordkit", "tests/typing/consumer.py"]

[[tool.mypy.overrides]]
module = ["openwakeword.*", "soxr"]
ignore_missing_imports = true
